# =====================================================================
#  ANAHTAR PLUGIN - AYAR DOSYASI
# =====================================================================
#
#  Bu dosyadaki her madde "items:" altinda bir ANAHTARI temsil eder.
#  Anahtarlarin HICBIR OZEL ISLEVI YOKTUR (kilit acma, sag tik, vs.
#  hicbir sey yapmazlar - bu plugin sadece gorunum/kozmetik saglar).
#  Hangi sandigin "hangi anahtarla" acilacagina SIZ karar verir / baska
#  bir sistemle (RP kurallari, baska bir kilit plugini, vs.) eslestirirsiniz.
#
#  BU ANAHTARLAR HAKKINDA 2 ONEMLI OZELLIK:
#   1) KIRILMAZ: ItemMeta "unbreakable" olarak isaretlidir.
#   2) YOK EDILEMEZ: Yerde dusse bile ATES, LAV ve PATLAMADAN (TNT,
#      creeper vb.) hicbir zarar gormez, yanip kul olmaz. Bu korumayi
#      plugin icindeki ItemKorumaListener saglar.
#
#  MATERYAL SECIMI NEDEN "SADDLE"?
#  Varsayilan olarak "SADDLE" (eyer) kullaniyoruz cunku:
#   - Hicbir vanilla crafting tarifinde MALZEME olarak kullanilmaz
#     (yani oyuncular anahtari bir tezgahta baska bir esya yapmak icin
#     kullanamaz, anahtar "tuketilemez/israf edilemez").
#   - Kendisi de craft edilemez (sadece mob loot / sandik / balik tutma
#     ile elde edilir), bu da onu dogal oyunda nadir ve "ozel" kilar.
#   - Max stack sayisi 1'dir (tipki gercek bir anahtar gibi tek tek tasinir).
#  Ayni ozelliklere sahip alternatifler: NAME_TAG, TRIDENT (trident
#  craft edilemez ve hicbir tarifte malzeme degildir), HEART_OF_THE_SEA
#  KULLANMAYIN (o, conduit tarifinde malzeme olarak kullanilir).
#
#  YENI ANAHTAR EKLEMEK ICIN (kendi anahtarlarini eklemek istersen):
#   1) Asagidaki "items:" listesine su sablonla yeni bir madde ekle:
#
#      benim-yeni-anahtarim:             # <-- kod-ici essiz kimlik (id), bosluksuz
#        material: SADDLE                 # crafting'de KULLANILMAYAN bir materyal sec (yukaridaki aciklamaya bak)
#        custom-model-data: 2021          # HER ANAHTAR ICIN FARKLI bir sayi olmali (cakismasin diye 2021, 2022... diye devam et)
#        isim: "&6&lBenim Yeni Anahtarim"  # '&' ile renk kodu kullanabilirsin (&a yesil, &c kirmizi, &l kalin, vs.)
#        aciklama:
#          - "&7Bu tamamen kozmetik bir anahtardir."
#          - "&7Hicbir otomatik islevi yoktur."
#
#   2) plugins/AnahtarPlugin/resourcepack/assets/minecraft/textures/item/anahtar/
#      klasorune "benim_yeni_anahtarim.png" adinda 16x16 boyutunda bir texture ekle.
#
#   3) plugins/AnahtarPlugin/resourcepack/assets/minecraft/models/item/anahtar/
#      klasorune "benim_yeni_anahtarim.json" adinda su icerikte bir dosya ekle:
#
#      {
#        "parent": "item/generated",
#        "textures": { "layer0": "item/anahtar/benim_yeni_anahtarim" }
#      }
#
#   4) plugins/AnahtarPlugin/resourcepack/assets/minecraft/models/item/saddle.json
#      dosyasindaki "overrides" listesine su blogu ekle (custom-model-data ile ayni sayi):
#
#      { "predicate": { "custom_model_data": 2021 }, "model": "item/anahtar/benim_yeni_anahtarim" }
#
#   5) Oyunda /anahtar reload komutunu calistir. Plugin resourcepack'i
#      otomatik olarak yeniden paketleyip oyunculara otomatik gonderecektir.
#
#  NOT: Eger "material" olarak SADDLE disinda bir sey kullanirsan (orn.
#  NAME_TAG), override'i saddle.json yerine o esyanin kendi model
#  dosyasina (orn. name_tag.json) eklemen gerekir.
#
# =====================================================================

resourcepack:
  # Sunucunun disaridan erisilebilen IP adresi veya domaini.
  # Kendi bilgisayarinda test icin "localhost" birakabilirsin ama
  # gercek oyuncularin baglanabilmesi icin sunucunun genel (public) IP'sini
  # veya domainini yazman GEREKIR. Ayrica bu portu (asagidaki port) router/
  # firewall uzerinden yonlendirmen (port forwarding) gerekebilir.
  host: "localhost"
  # Resourcepack'in sunuldugu port. Sunucu portundan (25565) farkli olmali.
  # Eger ayni sunucuda KristalPlugin de kuruluysa, onunla CAKISMAMASI icin
  # farkli bir port kullanilmistir (varsayilan: 8083).
  port: 8083
  # true ise, oyuncu paketi reddedemez / oyuna giremez (zorunlu kilar).
  force: true
  # Oyuncuya resourcepack istegiyle beraber gosterilecek mesaj.
  prompt-mesaji: "&6Bu sunucuda ozel anahtarlari gorebilmen icin kucuk bir texture paketi indiriliyor."

