name: Jar Derle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Maven ile derle
        run: mvn -B clean package

      - name: Jar dosyasini yukle (indirilebilir yap)
        uses: actions/upload-artifact@v4
        with:
          name: AnahtarPlugin-jar
          path: target/AnahtarPlugin.jar
